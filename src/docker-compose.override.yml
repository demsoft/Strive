version: "3.4"

services:
  identity-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT}
      # Demo: anybody can sign in with a made up name (development, e2e tests). Accounts: real accounts (email and
      # password, Google). compose.sh switches to Accounts when the file .env.identity exists.
      - Accounts__Mode=${ACCOUNTS_MODE:-Demo}
      # people with these email addresses are server administrators (admin overview), after their next sign in
      - Accounts__AdminEmails=${ACCOUNTS_ADMIN_EMAILS:-}
      - Accounts__AdminApiKey=${STRIVE_API_KEY}
      - Accounts__MongoDb__ConnectionString=mongodb://nosqldata
      # confirming the email address is off for now (set to true to require it, needs SMTP_HOST in production)
      - Accounts__RequireEmailConfirmation=${ACCOUNTS_REQUIRE_EMAIL_CONFIRMATION:-false}
      - Accounts__AllowedEmailDomains=${ACCOUNTS_ALLOWED_EMAIL_DOMAINS:-}
      - Accounts__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Accounts__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - Accounts__Email__From=${SMTP_FROM:-Strive <no-reply@localhost>}
      # Brevo API key: mails go through the Brevo API (SMTP_* are then not used); SMTP_FROM must be a validated sender there
      - Accounts__Email__BrevoApiKey=${BREVO_API_KEY:-}
      - Accounts__Email__Host=${SMTP_HOST:-}
      - Accounts__Email__Port=${SMTP_PORT:-587}
      - Accounts__Email__UseTls=${SMTP_TLS:-true}
      - Accounts__Email__User=${SMTP_USER:-}
      - Accounts__Email__Password=${SMTP_PASSWORD:-}

  strive:
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT}
      - Authentication__Authority=http://identity-api
      - KeyValueDatabase__UseInMemory=true
      - RabbitMq__UseInMemory=false
      - RabbitMq__RabbitMq__Host=amqp://rabbitmq
      - MongoDb__ConnectionString=mongodb://nosqldata
      - SFU__TokenSecret=${STRIVE_TOKEN_SECRET}
      - SFU__ApiKey=${STRIVE_API_KEY}
      - Turn__Urls__0=turn:${TURN_HOST}:3478?transport=udp
      - Turn__Urls__1=turn:${TURN_HOST}:3478?transport=tcp
      - Turn__Secret=${TURN_SECRET}
      # the admin overview reads the numbers of the other services
      - Admin__SfuUrl=http://sfu:3000
      - Admin__IdentityUrl=http://identity-api
      - Admin__ApiKey=${STRIVE_API_KEY}
      # Recording is off unless compose.sh is called with `--profile recording`
      - Recording__Enabled=${RECORDING_ENABLED:-false}
      - Recording__RetentionDays=${RECORDING_RETENTION_DAYS:-30}
      - Recording__Storage__ServiceUrl=${RECORDING_STORAGE_ENDPOINT:-}
      - Recording__Storage__PublicServiceUrl=${RECORDING_STORAGE_PUBLIC_URL:-}
      - Recording__Storage__ForcePathStyle=${RECORDING_STORAGE_FORCE_PATH_STYLE:-false}
      - Recording__Storage__Region=${RECORDING_STORAGE_REGION:-auto}
      - Recording__Storage__Bucket=${RECORDING_STORAGE_BUCKET:-strive-recordings}
      - Recording__Storage__AccessKeyId=${RECORDING_STORAGE_ACCESS_KEY_ID:-}
      - Recording__Storage__SecretAccessKey=${RECORDING_STORAGE_SECRET_ACCESS_KEY:-}
      - Recording__Recorder__BaseUrl=http://recorder:3000
      - Recording__Recorder__SharedSecret=${RECORDER_SHARED_SECRET}
      - Recording__Recorder__TokenSecret=${RECORDER_TOKEN_SECRET}

  sfu:
    environment:
      - SERVER_ENVIRONMENT=${APP_ENVIRONMENT}
      - API_CONFERENCE_MANAGEMENT=http://strive/v1/sfu/{conferenceId}?apiKey=${STRIVE_API_KEY}
      - AMQP_CONNECTION_STRING=amqp://rabbitmq
      - API_TOKEN_SECRET=${STRIVE_TOKEN_SECRET}
      # one udp and tcp port per worker (MEDIASOUP_WEBRTC_SERVER_PORT + worker index) instead of a port per transport; needed when
      # the ports are forwarded one by one (production on Docker Desktop). Empty: the port range of the build arguments.
      - MEDIASOUP_WEBRTC_SERVER_PORT=${MEDIASOUP_WEBRTC_SERVER_PORT:-}
      - MEDIASOUP_NUM_WORKERS=${MEDIASOUP_NUM_WORKERS:-}
      - ADMIN_API_KEY=${STRIVE_API_KEY}
      - MEDIASOUP_ANNOUNCED_IP=${ANNOUNCED_IP} # this will not work with firefox if it's localhost. to make it work for firefox, use your local ipv4 here
