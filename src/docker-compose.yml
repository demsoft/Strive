version: "3.4"

services:
  nosqldata:
    image: mongo

  rabbitmq:
    image: masstransit/rabbitmq:4.3
    volumes:
      - "./rabbitmq.conf:/etc/rabbitmq/conf.d/20-strive.conf:ro"

  coturn:
    image: coturn/coturn:4.18.0
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-strive}
      - --min-port=${TURN_MIN_PORT:-50000}
      - --max-port=${TURN_MAX_PORT:-50199}
    volumes:
      - "./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro"
    restart: unless-stopped

  identity-api:
    image: ${DOCKER_REGISTRY-}identityapi
    build: ./Services/Identity/Identity.API

  sfu:
    image: ${DOCKER_REGISTRY-}sfu
    build: "./Services/SFU"
    depends_on:
      - rabbitmq

  strive:
    image: ${DOCKER_REGISTRY-}strive
    build:
      context: .
      dockerfile: Services/ConferenceManagement/Strive/Dockerfile
    depends_on:
      - nosqldata
      - rabbitmq
      - identity-api
      - coturn

  webspa:
    image: ${DOCKER_REGISTRY-}webspa
    build:
      context: "./Web/WebSPA"
      args:
        - GITCOMMIT
        - GITREF
        - GITTIMESTAMP
    depends_on:
      - identity-api
      - sfu
      - strive
