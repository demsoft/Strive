version: "3.4"

services:
  sfu:
    build:
      args:
        - MEDIASOUP_MIN_PORT=2000
        - MEDIASOUP_MAX_PORT=2020
    ports:
      - "3000:3000"
      - "2000-2020:2000-2020/udp"
      - "2000-2020:2000-2020/tcp"
      - "9000:9000"
    environment:
      - DEBUG=strive-mediasoup**
  
  coturn:
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "50000-50199:50000-50199/udp"
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-strive}
      - --min-port=50000
      - --max-port=50199
      # in development the SFU is reached on private addresses (docker network), the base configuration denies them
      - --allowed-peer-ip=10.0.0.0-10.255.255.255
      - --allowed-peer-ip=172.16.0.0-172.31.255.255
      - --allowed-peer-ip=192.168.0.0-192.168.255.255

  traefik:
    image: "traefik:v2.11"
    command:
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "//var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.dev.yml:/traefik.yml:ro"
      - "./certs:/certs:ro"