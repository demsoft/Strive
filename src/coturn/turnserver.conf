# coturn configuration for Strive. The shared secret and the realm are passed on the command line (docker-compose.yml).
#
# Clients authenticate with time-limited credentials issued by the Strive API (TURN REST API scheme, see
# Strive.Core/Services/Media/TurnCredentialFactory.cs), so there is no user database.

listening-port=3478
use-auth-secret
fingerprint

# WebRTC only needs UDP relay endpoints. Disabling TCP relays and multicast peers reduces the attack surface.
no-tcp-relay
no-multicast-peers

# The UDP port range for relayed media (--min-port / --max-port) is set in docker-compose.yml (TURN_MIN_PORT,
# TURN_MAX_PORT). Browsers start a relay allocation for every peer connection (sending and receiving, so two per
# participant) while they gather candidates, but they drop it again as soon as a direct connection works. Plan for two
# ports per participant in the worst case, in practice only participants that need the relay keep theirs.

# limit what a single user and the whole server can allocate
user-quota=12
total-quota=1200
stale-nonce=600

# Do not relay to private networks. Otherwise anybody with a credential could reach hosts in your internal network
# through the TURN server. The SFU is reached on its public announced address (MEDIASOUP_ANNOUNCED_IP).
# docker-compose.dev.yml allows these ranges for local development.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255

# No TLS by default: UDP and TCP on port 3478 cover most networks. To offer "turns:" (TLS, e.g. on port 443 for
# networks that only allow HTTPS), provide a certificate and replace "no-tls" by:
#   cert=/path/to/fullchain.pem
#   pkey=/path/to/privkey.pem
#   tls-listening-port=5349
no-tls

# If the server is behind a 1:1 NAT (e.g. AWS, Azure) it has to know its public address:
#   external-ip=<public-ip>/<private-ip>

log-file=stdout
simple-log
