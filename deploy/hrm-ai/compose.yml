# Dedicated HRM stack; never combine with ordinary Strive production compose files.
name: goshrm-ai-meet
services:
  api:
    image: goshrm-ai-meet-api:${RELEASE:?full source revision required}
    build:
      context: ../../src
      dockerfile: Services/ConferenceManagement/Strive/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:5102:80"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes: ["${INSTALLATION:?private configuration required}/api.json:/app/appsettings.Production.json:ro"]
    depends_on:
      mongo: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      cache: {condition: service_started}
  web:
    image: goshrm-ai-meet-web:${RELEASE:?full source revision required}
    build:
      context: ../../src/Web/WebSPA
      args:
        ASSET_BASE: /
        GITCOMMIT: ${RELEASE}
        GITREF: feature/goshrm-ai-improvements
    restart: unless-stopped
    ports: ["127.0.0.1:5103:80"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes: ["${INSTALLATION:?}/web.json:/app/appsettings.Production.json:ro"]
  sfu:
    image: goshrm-ai-meet-sfu:${RELEASE:?}
    build: {context: ../../src/Services/SFU}
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:5104:3000"
      - "${MEDIA_PORT:?}:${MEDIA_PORT:?}/udp"
      - "${MEDIA_PORT:?}:${MEDIA_PORT:?}/tcp"
    env_file: ["${INSTALLATION:?}/sfu.env"]
    environment:
      SERVER_ENVIRONMENT: Production
      MEDIASOUP_NUM_WORKERS: '1'
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_WEBRTC_SERVER_PORT: ${MEDIA_PORT:?}
      DEBUG: ''
    depends_on:
      rabbitmq: {condition: service_healthy}
  mongo:
    image: mongo:6
    restart: unless-stopped
    env_file: ["${INSTALLATION:?}/mongo.env"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: masstransit/rabbitmq:4.3
    restart: unless-stopped
    env_file: ["${INSTALLATION:?}/rabbit.env"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - "cache-data:/data"
      - "${INSTALLATION:?}/redis.conf:/usr/local/etc/redis/redis.conf:ro"
  # Optional Linux standalone HTTPS entry point. Existing IIS can proxy the three loopback ports instead.
  edge:
    profiles: [edge]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - "${INSTALLATION:?}/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "${INSTALLATION:?}/certs:/certs:ro"
    depends_on: [api, web, sfu]
  turn:
    profiles: [relay]
    image: coturn/coturn:4.6.3
    # Read owner-only mounted relay/certificate files without making secrets world-readable.
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49260:49160-49260/udp"
    volumes:
      - "${INSTALLATION:?}/turnserver.conf:/etc/coturn/turnserver.conf:ro"
      - "${INSTALLATION:?}/certs:/certs:ro"
volumes:
  mongo-data:
  rabbit-data:
  cache-data:
