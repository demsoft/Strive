name: SFU
on:
  push:
    paths:
      - src/Services/SFU/**
      - .github/workflows/sfu-tests.yml

  pull_request:
    branches:
      - develop
    paths:
      - src/Services/SFU/**
      - .github/workflows/sfu-tests.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Services/SFU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: "src/Services/SFU/node_modules"
          key: ${{ runner.os }}-node22-sfu-modules-${{ hashFiles('src/Services/SFU/yarn.lock') }}
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck
      - name: Run tests
        run: yarn test
